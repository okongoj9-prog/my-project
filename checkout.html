<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="dist/css/bootstrap.css">
    <script src="dist/js/bootstrap.js"></script>
    <style>
        img{
            transform: scale(1.2);
            transition: 3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif';
        }

        body {
            background-color: #f4f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .checkout-container {
            background: #ffff;
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
        }

        .checkout-form {
            padding: 40px;
            flex: 1.5;
        }

        .checkout-form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            border-color: #2ecc71;
            outline: none;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row div {
            flex: 1;
        }

        .btn-pay {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-pay:hover {
            background-color: #27ae60;
        }

        .order-summary {
            background-color: #fcfcfc;
            border-left: 1px solid #eee;
            padding: 40px;
            flex: 1;
        }

        .order-summary h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #666;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight:  bold;
            color: #333;
        }

        @media (max-width: 768px) {
            .checkout-container {
                flex-direction: column-reverse;
            }
            .order-summary {
                border-left: none;
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>
    <!-- section one strat here -->
    <div class="container my-4">
    <section class="row mb-3">
        <div class="col-md-12">
            <nav class="navbar navbar-expand-md navbar-light bg-info p-3 rounded shadow-sm">
                <a href="index.html" class="navbar-brand"><b>Checkout</b>
                <button class="navbar-toggler" 
                data-bs-toggle="collapse"
                data-bs-target="#mynavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- below is div contain the contents that collapse inside -->
                 <div class="collapse navbar-collapse" id="mynavbar">
                    <div class="navbar-nav">
                        <a href="index.html" class="nav-link active">Home</a>
                        <a href="shopping.html"class="nav-link">Shopping</a>
                        <a href="checkout.html" class="nav-link">Checkout page</a>
                    </div>
                 </div>
            </nav>
        </div>
     </section><br>
      <div class="row mb-4 justify-content-center">
            <div class="col-md-6">
                <search>
                    <form action="" class="d-flex shadow-sm rounded">
                        <input type="search" class="form-control" placeholder="Search products here...">
                        <button class="btn btn-danger " type="submit">Search</button>
                    </form>
                </search>
            </div>
        </div>
     <!-- Section one end here -->
      <!--Section two strart here -->
      <div class="checkout-container">
        <div class="checkout-form">
            <h2>Billing and Payment</h2>
            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="john doe" required>

                <label for="email">Email Address</label>
                <input type="email" id="name" placeholder="john@example.com" required>

                <label for="card">Card Number</label>
                <input type="text" id="card" placeholder="1234 345 345" required>

                <div class="form-row">
                    <div>
                        <label for="exp">Expiration Date</label>
                        <input type="text" id="exp" placeholder="MM/YY" required>
                    </div>
                    <div>
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" placeholder="123" required>
                    </div>
                </div>

                <div class="order-summary">
                    <h2>Order summary</h2>
                    <div class="summary-item">
                        <span>Premium Plan * 1</span>
                        <span>$49.00</span>
                    </div>
                    <div class="summary-item">
                        <span>Taxes and Fees</span>
                        <span>&3.50</span>
                    </div>
                    <hr>
                    <div class="summary-total">
                        <span>Total Due</span>
                        <span>$52.50</span>
                    </div>
            </form>
        </div>
      </div>


</body>
</html>
